services:
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Shared base image, built first with `make base`.
        CAIRN_BASE_IMAGE: cairn-base:latest
    image: cairn-app
    container_name: cairn-server
    # Browser traffic goes through cairn-nginx (Basic Auth); the server is
    # only reachable on the compose network.
    expose:
      - "8000"
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  cairn-nginx:
    build:
      context: deploy/nginx
      dockerfile: Dockerfile
    image: cairn-nginx
    container_name: cairn-nginx
    ports:
      - "8000:80"
    volumes:
      # read-only: the entrypoint renders .htpasswd + nginx config from web.auth
      - ./dispatch.yaml:/cairn/dispatch.yaml:ro
    depends_on:
      cairn-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -qE ' (200|401) '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 3s
    restart: unless-stopped
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CAIRN_BASE_IMAGE: cairn-base:latest
    image: cairn-app
    container_name: cairn-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/cairn/dispatch.yaml
    depends_on:
      cairn-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "cairn", "dispatch", "--config", "dispatch.yaml"]
