<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairn</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/vendor/tailwindcss.js"></script>
<script src="/static/vendor/dagre.min.js"></script>
<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/vendor/cytoscape-dagre.js"></script>
<script src="/static/vendor/klay.js"></script>
<script src="/static/vendor/cytoscape-klay.js"></script>
<script src="/static/vendor/elk.bundled.js"></script>
<script src="/static/vendor/cytoscape-elk.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  #cy { width: 100%; height: 100%; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .overlay { background: rgba(15,23,42,0.25); backdrop-filter: blur(6px); }
  .timeline-flash { animation: timelineFlash 1s ease-out; }
  .decide-chip-running { animation: decideChipGlow 1.8s ease-in-out infinite; }
  .step-chip-running { animation: stepChipGlow 1.8s ease-in-out infinite; }
  .decide-panel-running::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 22px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.14), rgba(56, 189, 248, 0));
    animation: decidePanelPulse 2.1s ease-out infinite;
    pointer-events: none;
  }
  .decide-beacon {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 9999px;
    background: #0ea5e9;
    box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.16);
  }
  .decide-beacon::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 9999px;
    border: 1.5px solid rgba(14, 165, 233, 0.34);
    animation: decideBeaconPulse 1.8s ease-out infinite;
  }
  .decide-graph-scan {
    position: absolute;
    inset: 8px;
    overflow: hidden;
    pointer-events: none;
    border-radius: 18px;
  }
  .decide-graph-scan::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow:
      inset 0 0 0 1px rgba(125, 211, 252, 0.32),
      inset 0 0 30px rgba(125, 211, 252, 0.06),
      inset 0 0 64px rgba(56, 189, 248, 0.03);
    animation: decideFramePulse 2.8s ease-in-out infinite;
  }
  .decide-graph-scan::after {
    content: "";
    position: absolute;
    inset: 0;
    inset: 12px;
    border-radius: 12px;
    background:
      linear-gradient(90deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18)),
      linear-gradient(180deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18)),
      linear-gradient(270deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18)),
      linear-gradient(0deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18));
    background-size: 18px 2px, 2px 18px, 18px 2px, 2px 18px;
    background-position: left top, left top, right bottom, right bottom;
    background-repeat: no-repeat;
    opacity: 0.6;
  }
  .decide-graph-scan > span {
    position: absolute;
    inset: 0;
    display: block;
  }
  .decide-graph-grid {
    inset: 12px;
    border-radius: 12px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(186, 230, 253, 0) 0,
        rgba(186, 230, 253, 0) 35px,
        rgba(186, 230, 253, 0.045) 36px,
        rgba(186, 230, 253, 0.045) 37px
      ),
      repeating-linear-gradient(
        180deg,
        rgba(186, 230, 253, 0) 0,
        rgba(186, 230, 253, 0) 35px,
        rgba(186, 230, 253, 0.04) 36px,
        rgba(186, 230, 253, 0.04) 37px
      );
    opacity: 0.42;
  }
  .decide-graph-ambient {
    inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.11), rgba(56, 189, 248, 0) 30%),
      radial-gradient(circle at 84% 16%, rgba(59, 130, 246, 0.08), rgba(59, 130, 246, 0) 24%),
      linear-gradient(180deg, rgba(186, 230, 253, 0.055), rgba(255, 255, 255, 0) 46%);
    animation: decideAmbientPulse 2.4s ease-in-out infinite alternate;
  }
  .decide-graph-scanline {
    inset: 0;
  }
  .decide-graph-scanline::before {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    height: 2px;
    top: 12%;
    background: linear-gradient(90deg, rgba(56, 189, 248, 0), rgba(186, 230, 253, 0.96), rgba(56, 189, 248, 0));
    box-shadow:
      0 0 18px rgba(125, 211, 252, 0.42),
      0 0 34px rgba(186, 230, 253, 0.16);
    animation: decideGraphScanline 4.2s linear infinite;
  }
  .decide-graph-sweep {
    inset: -18%;
    background: linear-gradient(
      103deg,
      rgba(14, 165, 233, 0) 40%,
      rgba(56, 189, 248, 0.04) 47%,
      rgba(255, 255, 255, 0.22) 50%,
      rgba(125, 211, 252, 0.1) 53%,
      rgba(14, 165, 233, 0) 60%
    );
    transform: translateX(-86%) skewX(-14deg);
    animation: decideGraphSweep 4.6s ease-in-out infinite;
  }
  .title-action-trigger {
    min-width: 0;
  }
  .title-action-button {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 180ms ease, transform 180ms ease, background-color 180ms ease, color 180ms ease, border-color 180ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .title-action-button {
      opacity: 0;
      transform: translateY(2px);
      pointer-events: none;
    }
    .title-action-trigger:hover .title-action-button,
    .title-action-trigger:focus-within .title-action-button {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  }
  @keyframes timelineFlash {
    0% { background: rgba(99, 102, 241, 0.18); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.2); }
    35% { background: rgba(99, 102, 241, 0.12); box-shadow: 0 0 0 8px rgba(99, 102, 241, 0.08); }
    100% { background: rgba(99, 102, 241, 0); box-shadow: 0 0 0 14px rgba(99, 102, 241, 0); }
  }
  @keyframes decideBeaconPulse {
    0% { transform: scale(0.72); opacity: 0.9; }
    70% { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes decidePanelPulse {
    0% { transform: scale(0.96); opacity: 0; }
    18% { opacity: 1; }
    70% { transform: scale(1.02); opacity: 0.18; }
    100% { transform: scale(1.03); opacity: 0; }
  }
  @keyframes decideChipGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.18); }
    50% { box-shadow: 0 0 0 7px rgba(56, 189, 248, 0.08); }
  }
  @keyframes stepChipGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.18); }
    50% { box-shadow: 0 0 0 7px rgba(251, 191, 36, 0.08); }
  }
  @keyframes decideGraphSweep {
    0% { transform: translateX(-86%) skewX(-14deg); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(88%) skewX(-14deg); opacity: 0; }
  }
  @keyframes decideAmbientPulse {
    0% { opacity: 0.75; }
    100% { opacity: 1; }
  }
  @keyframes decideGraphScanline {
    0% { top: 11%; opacity: 0.18; }
    8% { opacity: 0.55; }
    50% { opacity: 0.42; }
    92% { opacity: 0.55; }
    100% { top: 87%; opacity: 0.18; }
  }
  @keyframes decideFramePulse {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }
</style>
<script>
  tailwind.config = {
    theme: {
      fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','Inter','Segoe UI','sans-serif'] },
      extend: {
        colors: {
          brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' }
        }
      }
    }
  }
</script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden" :class="{ 'select-none cursor-col-resize': isResizingPanel }" x-data="cairnApp()">

<!-- ═══════════ PROJECT LIST VIEW ═══════════ -->
<div x-show="view === 'list'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="h-8 w-8 rounded-lg border border-slate-200 bg-white shadow-sm shadow-slate-200/40 flex items-center justify-center shrink-0 overflow-hidden">
        <img src="/static/favicon.svg" alt="" class="w-5 h-5 block">
      </div>
      <span class="font-semibold text-slate-700 tracking-tight">Cairn</span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-3 text-[11px] text-slate-400">
      <span class="inline-flex items-center gap-1.5 shrink-0" title="全部项目">
        <span class="font-medium uppercase tracking-[0.12em] text-slate-400">全部</span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="projects.length"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="进行中的项目">
        <span class="h-1.5 w-1.5 rounded-full bg-teal-500"></span>
        <span class="font-semibold text-teal-700 tabular-nums" x-text="countProjectsByStatus('active')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="已暂停的项目">
        <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
        <span class="font-semibold text-amber-700 tabular-nums" x-text="countProjectsByStatus('stopped')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" title="已完成的项目">
        <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="countProjectsByStatus('completed')"></span>
      </span>
      <button type="button"
        @click="stopAllActiveProjects()"
        :disabled="!hasActiveProjects() || isStoppingAllProjects"
        class="h-7 px-2.5 rounded-lg border border-amber-200 text-xs text-amber-700 hover:bg-amber-50 transition inline-flex items-center gap-1.5 shrink-0 disabled:cursor-not-allowed disabled:opacity-40"
        title="暂停所有进行中的项目">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        <span x-text="isStoppingAllProjects ? '暂停中…' : '全部暂停'"></span>
      </button>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="showNewProject = true" class="h-7 px-2.5 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        新建项目
      </button>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <button @click="showLocalPrefs = true" class="h-7 max-w-40 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center shrink-0">
        <span class="truncate block" x-text="actorName()"></span>
      </button>
      <button @click="loadSettings(); showSettings = true" class="h-7 w-7 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition inline-flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7 7 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a7 7 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a7 7 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a7 7 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path d="M15 12a3 3 0 1 1-6 0-3 3 0 0 1 6 0Z"/></svg>
      </button>
    </div>
  </header>

  <div x-ref="projectListScroll" @scroll.passive="rememberProjectListScroll()" class="flex-1 overflow-y-auto p-4">
    <template x-if="projects.length === 0">
      <div class="flex flex-col items-center justify-center h-full text-slate-400">
        <img src="/static/favicon.svg" alt="" class="w-20 h-20 mb-5 opacity-30">
        <p class="text-lg font-medium text-slate-500">还没有项目</p>
        <p class="text-sm mt-1">创建一个项目开始探索</p>
      </div>
    </template>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
      <template x-for="p in projects" :key="p.id">
        <div @click="openProject(p.id)"
          class="group h-full flex flex-col bg-white rounded-2xl border border-slate-200/60 p-5 cursor-pointer transition-all duration-200 hover:shadow-lg hover:shadow-slate-200/50 hover:border-slate-300 hover:-translate-y-0.5">
          <div class="flex items-start justify-between mb-3">
            <span class="text-[11px] font-mono text-slate-400 tracking-wide" x-text="p.id"></span>
            <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold uppercase tracking-[0.12em]"
              :class="projectStatusBadgeClass(p.status)"
              x-text="p.status"></span>
          </div>
          <div class="mb-3 flex-1">
            <div class="title-action-trigger flex items-start gap-2">
              <h3 class="min-w-0 flex-1 text-[15px] font-semibold text-slate-700 break-words [overflow-wrap:anywhere] group-hover:text-brand-600 transition-colors" x-text="p.title"></h3>
              <button type="button"
                @click.stop="openRenameProject(p.id, p.title)"
                class="title-action-button mt-0.5 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"
                title="重命名项目"
                :aria-label="`重命名 ${p.title}`">
                <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m16.862 4.487 1.65-1.65a1.875 1.875 0 1 1 2.652 2.652l-9.193 9.193a4.5 4.5 0 0 1-1.897 1.13L6 17l1.188-4.074a4.5 4.5 0 0 1 1.13-1.897l8.544-8.542Z"/><path d="M19.5 7.125 16.875 4.5"/><path d="M5.25 18.75h13.5"/></svg>
              </button>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">
              <template x-if="p.decide">
                <div class="inline-flex items-center gap-1.5 rounded-full border border-sky-200 bg-sky-50 px-2 py-1 text-[10px] font-medium text-sky-700 decide-chip-running">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 3v3"/><path d="M18.364 5.636 16.95 7.05"/><path d="M21 12h-3"/><path d="m18.364 18.364-1.414-1.414"/><path d="M12 21v-3"/><path d="m7.05 16.95-1.414 1.414"/><path d="M6 12H3"/><path d="M7.05 7.05 5.636 5.636"/><circle cx="12" cy="12" r="3.5"/></svg>
                  <span x-text="decideBadgeText(p.decide, true)"></span>
                </div>
              </template>
              <template x-if="p.running_step_count > 0">
                <div class="inline-flex items-center gap-1.5 rounded-full border border-amber-200 bg-amber-50 px-2 py-1 text-[10px] font-medium text-amber-700 step-chip-running">
                  <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="8.5"/></svg>
                  <span x-text="runningStepBadgeText(p.running_step_count)"></span>
                </div>
              </template>
            </div>
          </div>
          <div class="flex items-center gap-3 text-[11px] text-slate-400">
            <span class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2m15.07-7.07l-2.83 2.83M9.76 14.24l-2.83 2.83m11.14 0l-2.83-2.83M9.76 9.76L6.93 6.93"/></svg>
              <span x-text="p.fact_count"></span>
            </span>
            <span class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
              <span x-text="p.step_count"></span>
            </span>
            <template x-if="p.running_step_count > 0">
              <span class="flex items-center gap-1 text-amber-500">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg>
                <span x-text="p.running_step_count"></span>
              </span>
            </template>
            <template x-if="p.pending_step_count > 0">
              <span class="flex items-center gap-1 text-slate-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                <span x-text="p.pending_step_count"></span>
              </span>
            </template>
            <span class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547Z"/></svg>
              <span x-text="p.hint_count"></span>
            </span>
          </div>
          <div class="mt-1.5 flex items-center gap-1.5 text-[11px] text-slate-400">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 2v3M16 2v3"/><path d="M3.5 9.5h17"/><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M8 13h3M8 16h6"/></svg>
            <span x-text="formatDate(p.created_at)"></span>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-end gap-1.5">
            <div class="flex items-center justify-end gap-1.5 flex-wrap">
              <button type="button" @click.stop="viewProjectYaml(p.id, p.title)"
                class="px-2 py-1 rounded-lg border border-slate-200 text-[11px] text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14.25 3H7.5A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V8.25L14.25 3Z"/><path d="M14.25 3v5.25h4.5"/><path d="M8.25 12h7.5M8.25 15h5.25"/></svg>
                快照
              </button>
              <template x-if="p.status !== 'completed'">
                <button type="button" @click.stop="toggleProjectStopById(p.id, p.status)"
                  class="px-2 py-1 rounded-lg border text-[11px] transition flex items-center gap-1"
                  :class="p.status === 'active'
                    ? 'border-amber-200 text-amber-600 hover:bg-amber-50'
                    : 'border-teal-200 text-teal-600 hover:bg-teal-50'">
                  <svg x-show="p.status === 'active'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                  <svg x-show="p.status === 'stopped'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
                  <span x-text="p.status === 'active' ? '暂停' : '继续'"></span>
                </button>
              </template>
              <template x-if="p.status === 'completed'">
                <button type="button" @click.stop="openReopenProject(p.id, p.title)"

          </div>
        </div>

    </div>
  </div>
</div>

<!-- ═══════════ GRAPH VIEW ═══════════ -->

    <div class="flex-1"></div>

          <template x-for="item in findingSeverityCounts()" :key="`hdr-sev-${item.key}`">

              <span class="h-1.5 w-1.5 rounded-full shrink-0" :style="`background:${severityColor(item.key)}`"></span>

      </span>
      <span x-show="usageTotal() > 0" class="inline-flex items-center gap-1 rounded-full border border-slate-200/80 bg-slate-50 px-2 py-0.5"

        <span class="font-medium text-slate-500 tabular-nums" x-text="`${formatTokens(usageTotal())} tokens`"></span>
      </span>
    </div>
    <div class="flex items-center gap-1.5">
      <template x-if="!replay.active">
        <button @click="startProjectReplay()" class="px-2.5 py-1 rounded-lg border border-violet-200 text-xs text-violet-600 hover:bg-violet-50 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/><path d="M4 5v14"/></svg>

        </button>
      </template>
      <template x-if="replay.active">
        <div class="flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50/80 px-2 py-1 text-xs text-violet-700">

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
          </button>
          <select x-model="replay.stepMs" @change="updateReplaySpeed()" class="h-6 rounded-md border border-violet-200 bg-white/80 px-1.5 text-[11px] text-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-100">

            <option value="1100">中</option>
            <option value="1600">慢</option>

          <button @click="exitProjectReplay()" class="inline-flex h-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 px-2 hover:bg-white transition">

        </div>
      </template>
      <button @click="viewProjectYaml(selectedProjectId, project.project.title)" class="px-2.5 py-1 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14.25 3H7.5A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V8.25L14.25 3Z"/><path d="M14.25 3v5.25h4.5"/><path d="M8.25 12h7.5M8.25 15h5.25"/></svg>

      <template x-if="!replay.active && project.project.status !== 'completed'">
        <button @click="toggleProjectStop()"
          class="px-2.5 py-1 rounded-lg border text-xs transition flex items-center gap-1.5"

            : 'border-teal-200 text-teal-600 hover:bg-teal-50'">
          <svg x-show="project.project.status === 'active'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          <svg x-show="project.project.status === 'stopped'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
          <span x-text="project.project.status === 'active' ? '暂停' : '继续'"></span>
        </button>
      </template>
      <template x-if="!replay.active && project.project.status === 'completed'">
        <button @click="openReopenProject(project.project.id, project.project.title)"
          class="px-2.5 py-1 rounded-lg border border-sky-200 text-xs text-sky-600 hover:bg-sky-50 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
          重新开启
        </button>
      </template>
      <button x-show="!replay.active" @click="deleteProject()" class="px-2.5 py-1 rounded-lg border border-rose-200 text-xs text-rose-500 hover:bg-rose-50 hover:text-rose-600 transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6"/><path d="M19 6l-.63 11.338A2 2 0 0 1 16.37 19.5H7.63a2 2 0 0 1-1.997-2.162L5 6"/><path d="M10 10.5v5"/><path d="M14 10.5v5"/></svg>
        删除
      </button>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <button @click="showLocalPrefs = true" class="h-7 max-w-40 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center shrink-0">

      <button @click="loadSettings(); showSettings = true" class="h-7 w-7 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition inline-flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7 7 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a7 7 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a7 7 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a7 7 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path d="M15 12a3 3 0 1 1-6 0-3 3 0 0 1 6 0Z"/></svg>
      </button>

  </header>

  <div class="flex-1 flex overflow-hidden" id="graphLayout">

          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>

      <!-- Legend -->
      <div class="absolute bottom-3 left-3 z-10">
        <button type="button" @click="showLegend = !showLegend"
          class="h-7 px-2 bg-white/90 backdrop-blur rounded-lg shadow-sm border border-slate-200/60 text-[11px] text-slate-500 hover:text-slate-700 hover:bg-white transition inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="1.5"/></svg>
          图例
        </button>
        <div x-show="showLegend" x-cloak
          class="mt-1.5 w-64 rounded-xl border border-slate-200/70 bg-white/95 backdrop-blur shadow-lg p-3 space-y-2 text-[11px] text-slate-500">
          <div class="grid grid-cols-2 gap-x-3 gap-y-1.5">
            <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-4 rounded-sm bg-teal-500"></span>起点事实</span>

            <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rotate-45 bg-yellow-500"></span>发现</span>

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547Z"/></svg>

        <div class="flex gap-1.5" x-show="projectIsActive()">
          <button @click="sendHeartbeatForSelectedStep()" :disabled="!selectedActionableOpenStepRecord()"

            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12h3.5l2.75-6 3.5 12 2.75-7H21"/></svg>
            <span x-text="selectedStepPrimaryActionLabel()"></span>
          </button>

            class="w-full resize-none rounded-xl border border-slate-200 px-3 py-2 text-xs text-slate-700 focus:border-brand-300 focus:outline-none"></textarea>
          <div class="flex items-center justify-between gap-2">
            <span class="text-[10px] text-slate-400">只读快照 · 不写入图 · 不占用执行槽位</span>
            <div class="flex items-center gap-2">
              <button type="button" x-show="questions.length" @click="clearQuestions()"
                class="text-[11px] text-slate-400 hover:text-rose-500 transition">清空历史</button>
              <button type="button" @click="askQuestion()" :disabled="questionSending || !questionInput.trim()"
                class="px-3 py-1.5 rounded-lg bg-brand-500 text-white text-[11px] font-medium disabled:opacity-40 hover:bg-brand-600 transition">提问</button>
            </div>
          </div>
        </div>

        <template x-if="questions.length === 0">
          <p class="text-sm text-slate-300 text-center mt-8">还没有旁路提问</p>
        </template>
        <template x-for="q in [...questions].reverse()" :key="q.id">
          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="w-2 h-2 rounded-full shrink-0" :class="questionStatusDotClass(q.status)"></span>
                <span class="text-[11px] font-medium text-slate-600" x-text="questionStatusLabel(q.status)"></span>
                <span class="text-[10px] text-slate-400 truncate" x-text="q.worker || ''"></span>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="text-[10px] text-slate-400 tabular-nums" x-text="formatTime(q.created_at)"></span>
                <button type="button" x-show="q.status === 'pending' || q.status === 'running'" @click="cancelQuestion(q.id)"
                  class="text-[10px] text-slate-400 hover:text-rose-500 transition">取消</button>
              </div>
            </div>
            <div class="p-4 space-y-2">
              <p class="text-xs font-medium text-slate-700 whitespace-pre-wrap break-words" x-text="q.content"></p>
              <p x-show="q.answer" class="text-xs leading-relaxed text-slate-600 whitespace-pre-wrap break-words" x-text="q.answer"></p>
              <p x-show="q.error" class="text-xs text-rose-500 whitespace-pre-wrap break-words" x-text="q.error"></p>
              <p x-show="q.status === 'pending' || q.status === 'running'" class="text-[11px] text-slate-400">正在基于当前图快照回答…</p>
            </div>
          </section>
        </template>
      </div>

      <!-- Sessions -->
      <div x-show="sideTab === 'sessions'" x-ref="sessionList" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/40">
        <template x-if="(project.sessions || []).length === 0">
          <p class="text-sm text-slate-300 text-center mt-12">还没有模型会话记录</p>
        </template>
        <template x-for="session in [...(project.sessions || [])].reverse()" :key="session.id">
          <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <button type="button" @click="toggleSession(session.id)" class="w-full text-left px-4 py-3 space-y-2 hover:bg-slate-50/70 transition">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="px-1.5 py-0.5 rounded-md text-[10px] font-semibold tracking-wide" :class="sessionPhaseClass(session.phase)"
                    :title="session.phase" x-text="sessionPhaseLabel(session.phase)"></span>
                  <span class="text-xs font-medium text-slate-700 truncate" x-text="session.worker"></span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <span x-show="session.status === 'running'" class="text-[10px] font-medium text-sky-600">实时</span>
                  <span class="w-2 h-2 rounded-full shrink-0" :class="sessionStatusDotClass(session.status)"></span>
                </div>
              </div>
              <p x-show="sessionSummary(session)" class="text-xs leading-relaxed text-slate-600 break-words line-clamp-2"
                :title="sessionSummary(session)" x-text="sessionSummary(session)"></p>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-400">
                <span x-text="session.step ? `${session.id} · ${session.step}` : session.id"></span>
                <span x-show="session.message_count" x-text="`${session.message_count} 条`"></span>
                <span x-show="session.duration_ms != null" x-text="formatDurationMs(session.duration_ms)"></span>
                <span x-show="session.total_tokens" class="text-slate-400 tabular-nums"
                  :title="sessionUsageTitle(session)"
                  x-text="`${formatTokens(session.total_tokens)} tokens`"></span>
                <span x-show="session.timed_out" class="text-amber-500">超时</span>
                <span x-show="session.returncode != null && session.returncode !== 0" class="text-rose-500" x-text="`exit ${session.returncode}`"></span>
                <span class="ml-auto tabular-nums" x-text="formatTime(session.created_at)"></span>
              </div>
              <p x-show="session.error" class="text-[11px] text-rose-500 break-words" x-text="session.error"></p>
            </button>
            <div x-show="isSessionOpen(session.id)" x-transition class="border-t border-slate-100 bg-slate-50/60">
              <div class="session-transcript px-3 py-3 space-y-2 overflow-y-auto" :style="`max-height: ${transcriptMaxHeight}px`">
                <template x-if="sessionLoadingId === session.id && sessionMessages(session.id).length === 0">
                  <p class="text-[11px] text-slate-400 text-center py-2">加载中…</p>
                </template>
                <template x-if="sessionLoadingId !== session.id && sessionMessages(session.id).length === 0">
                  <p class="text-[11px] text-slate-400 text-center py-2">没有记录到消息</p>
                </template>
                <template x-for="message in sessionMessages(session.id)" :key="`${session.id}-${message.seq}`">
                  <div>
                  <!-- tool traffic collapses to one line so the conversation stays readable -->
                  <div x-show="isToolMessage(message.role)">
                    <button type="button" @click="toggleToolMessage(session.id, message.seq)"
                            class="w-full text-left rounded-lg border px-2.5 py-1.5 hover:brightness-[0.98] transition"
                            :class="sessionMessageClass(message.role)">
                      <div class="flex items-center gap-2">
                        <span class="text-[10px] font-semibold shrink-0" x-text="sessionRoleLabel(message.role)"></span>
                        <span class="text-[10px] opacity-70 truncate font-mono" x-text="toolMessageSummary(message)"></span>
                        <span class="ml-auto text-[10px] opacity-40 shrink-0" x-text="isToolMessageOpen(session.id, message.seq) ? '收起' : '展开'"></span>
                      </div>
                      <pre x-show="isToolMessageOpen(session.id, message.seq)" x-cloak
                           class="mt-1.5 text-[11px] leading-relaxed whitespace-pre-wrap break-words max-h-72 overflow-y-auto opacity-90" x-text="message.content"></pre>
                    </button>
                  </div>
                  <div x-show="!isToolMessage(message.role)">
                    <div class="flex items-center gap-2 mb-0.5">
                      <span class="text-[10px] font-semibold tracking-wide" :class="sessionRoleClass(message.role)" x-text="sessionRoleLabel(message.role)"></span>
                      <span class="text-[10px] text-slate-300 tabular-nums ml-auto" x-text="`#${message.seq}`"></span>
                    </div>
                    <div class="rounded-2xl px-3 py-2 border" :class="sessionMessageClass(message.role)">
                      <p class="text-xs leading-relaxed whitespace-pre-wrap break-words" x-text="message.content"></p>
                    </div>
                  </div>
                  </div>
                </template>
                <template x-if="isSessionRunning(session.id)">
                  <p class="text-[11px] text-sky-500 flex items-center gap-1.5 px-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                    模型正在输出…
                  </p>
                </template>
              </div>
            </div>
          </section>
        </template>
      </div>

      <!-- Log -->
      <div x-show="sideTab === 'log'" class="flex-1 overflow-y-auto p-4 space-y-3">
        <template x-if="selectedTimelineSummary()">
          <section class="sticky top-0 z-10 rounded-2xl border border-slate-200 bg-white/95 backdrop-blur px-4 py-3 shadow-sm">
            <div class="space-y-2.5">
              <div class="space-y-1">
                <div class="flex items-center justify-between gap-3 text-[11px]">
                  <span class="text-slate-400">顺序</span>
                  <span class="font-mono text-slate-600" x-text="selectedTimelineSummary().sequenceLabel"></span>
                </div>
                <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden">
                  <div class="h-full rounded-full bg-brand-400 transition-all duration-300" :style="`width:${selectedTimelineSummary().sequencePercent}%`"></div>
                </div>
              </div>
              <div class="space-y-1">
                <div class="flex items-center justify-between gap-3 text-[11px]">
                  <span class="text-slate-400">时间跨度</span>
                  <span class="font-mono text-slate-600 text-right" x-text="selectedTimelineSummary().timeLabel"></span>
                </div>
                <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden">
                  <div class="h-full rounded-full bg-teal-400 transition-all duration-300" :style="`width:${selectedTimelineSummary().timePercent}%`"></div>
                </div>
              </div>
            </div>
          </section>
        </template>
        <template x-if="timelineEvents().length === 0">
          <p class="text-sm text-slate-300 text-center mt-12">还没有活动</p>
        </template>
        <template x-for="entry in timelineEvents()" :key="entry.id">
          <div class="flex items-stretch gap-3" :id="timelineEntryDomId(entry.id)">
            <div class="flex flex-col items-center shrink-0">
              <div class="w-2.5 h-2.5 rounded-full mt-1.5" :class="timelineEventDotClass(entry)"></div>
              <div class="w-px flex-1 bg-slate-100 mt-2" x-show="!entry.isLast"></div>
            </div>
            <button type="button" @click="openTimelineEntry(entry)"
              class="min-w-0 flex-1 text-left rounded-xl px-0.5 py-0.5 transition"
              :class="timelineEntryButtonClass(entry)">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-[11px] font-medium text-slate-400 tabular-nums" x-text="formatTime(entry.timestamp)"></span>
                <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wide"
                  :class="timelineEventBadgeClass(entry)" x-text="timelineEventBadge(entry)"></span>
                <span class="text-[11px] text-slate-300" x-text="formatTimelineDate(entry.timestamp)"></span>
              </div>
              <template x-if="entry.title">
                <p class="text-sm text-slate-700 leading-relaxed break-words mt-1" x-text="entry.title"></p>
              </template>
              <template x-if="entry.actor || entry.meta.length > 0">
                <p class="text-[11px] text-slate-400 mt-1 break-words" x-text="[entry.actor, ...entry.meta].filter(Boolean).join(' · ')"></p>
              </template>
            </button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
</template>

<!-- ═══════════ MODALS ═══════════ -->

<!-- New Project -->
<div x-show="showNewProject" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showNewProject = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-4">新建项目</h3>
    <div class="space-y-3">
      <input x-model="newProject.title" placeholder="项目标题" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300">
      <textarea x-model="newProject.origin" placeholder="起点 — 项目起始信息" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <textarea x-model="newProject.goal" placeholder="目标 — 想要达成的结果" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <p class="px-1 text-[11px] text-slate-400">起点会成为第一个事实，目标会成为根目标节点，随后由 Decide 规划最初的步骤。</p>

      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">提示（可选）</span>
          <button type="button" @click="newProject.hints.push({ content: '' })" class="text-[11px] text-brand-500 hover:text-brand-600 font-medium">+ 添加</button>
        </div>
        <template x-for="(hint, idx) in newProject.hints" :key="idx">
          <div class="flex gap-2 mb-2">
            <input x-model="hint.content" placeholder="提示内容" class="flex-1 px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300">
            <button type="button" @click="newProject.hints.splice(idx, 1)" x-show="newProject.hints.length > 1" class="px-2 text-slate-300 hover:text-red-400 transition text-sm">&times;</button>
          </div>
        </template>
        <p class="text-[11px] text-slate-400">提示的创建者使用本地身份： <span class="font-medium text-slate-600" x-text="actorName()"></span></p>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showNewProject = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="createProject()" :disabled="!newProject.title || !newProject.origin || !newProject.goal"
        class="px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition disabled:opacity-30 shadow-sm shadow-brand-200">创建</button>
    </div>
  </div>
</div>

<!-- Create Step -->
<div x-show="showStepModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showStepModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">新建步骤</h3>
    <div class="mb-4">
      <label class="text-[11px] text-slate-400 mb-1 block font-medium">来源事实</label>
      <div class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 min-h-[42px] flex flex-wrap gap-1.5 items-center">
        <template x-for="fid in selectedFacts" :key="`step-from-${fid}`">
          <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-mono text-slate-600" x-text="fid"></span>
        </template>
      </div>
    </div>
    <div class="space-y-3">
      <textarea x-model="stepForm.description" placeholder="你要探索什么？" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者: <span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showStepModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="createStep(false)" :disabled="!stepForm.description"
        class="px-5 py-2 text-sm border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition disabled:opacity-30">声明</button>
      <button @click="createStep(true)" :disabled="!stepForm.description"
        class="px-5 py-2 text-sm bg-brand-500 text-white rounded-xl font-medium hover:bg-brand-600 transition disabled:opacity-30 shadow-sm shadow-brand-200">声明并认领</button>
    </div>
  </div>
</div>

<!-- Conclude -->
<div x-show="showConcludeModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showConcludeModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">结束步骤</h3>
    <p class="text-xs text-slate-400 mb-4 font-mono" x-text="concludeForm.stepId"></p>
    <div class="space-y-3">
      <textarea x-model="concludeForm.description" placeholder="你发现了什么？（将作为新事实）" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者: <span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showConcludeModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="concludeStep()" :disabled="!concludeForm.description"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200">结束</button>
    </div>
  </div>
</div>

<!-- Complete Project -->
<div x-show="showCompleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showCompleteModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">完成项目</h3>
    <p class="text-xs text-slate-400 mb-4">将项目标记为已完成</p>
    <div class="space-y-3">
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">来源事实</label>
        <div class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 min-h-[42px] flex flex-wrap gap-1.5 items-center">
          <template x-for="fid in selectedFacts" :key="`complete-from-${fid}`">
            <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-mono text-slate-600" x-text="fid"></span>
          </template>
        </div>
      </div>
      <textarea x-model="completeForm.description" placeholder="为什么目标已经达成？" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者: <span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showCompleteModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="completeProject()" :disabled="selectedFacts.length === 0 || !completeForm.description"
        class="px-5 py-2 text-sm bg-teal-500 text-white rounded-xl font-medium hover:bg-teal-600 transition disabled:opacity-30 shadow-sm shadow-teal-200">完成</button>
    </div>
  </div>
</div>

<!-- Hint -->
<div x-show="showHintModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showHintModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-4">添加提示</h3>
    <div class="space-y-3">
      <textarea x-model="hintForm.content" placeholder="策略建议或备注…" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者: <span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showHintModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="addHint()" :disabled="!hintForm.content"
        class="px-5 py-2 text-sm bg-amber-500 text-white rounded-xl font-medium hover:bg-amber-600 transition disabled:opacity-30 shadow-sm shadow-amber-200">添加</button>
    </div>
</div>
</div>

<!-- Reopen -->
<div x-show="showReopenModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showReopenModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">重新开启项目</h3>
    <p class="text-xs text-slate-400 mb-4" x-text="projectLabel(reopenForm.projectId, reopenForm.projectTitle)"></p>
    <div class="space-y-3">
      <textarea x-model="reopenForm.description" placeholder="为什么这个项目实际上并未完成？" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300"></textarea>
      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-500">
        操作者: <span class="font-medium text-slate-700" x-text="actorName()"></span>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showReopenModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">取消</button>
      <button @click="reopenProject()" :disabled="!reopenForm.projectId || !reopenForm.description"
        class="px-5 py-2 text-sm bg-sky-500 text-white rounded-xl font-medium hover:bg-sky-600 transition disabled:opacity-30 shadow-sm shadow-sky-200">重新开启</button>
    </div>
  </div>
</div>

<!-- Rename Project -->
<div x-show="showRenameModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showRenameModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">重命名项目</h3>
