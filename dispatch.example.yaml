# Cairn server API endpoint.
server: "http://cairn-server:8000"

# Shared environment variables merged into every worker.
common_env:
  TSEC_SERVER_HOST: "<SERVER_HOST>:8000"
  TSEC_AGENT_TOKEN: "xxx"

runtime:
  # Scheduler tick interval in seconds.
  interval: 3
  # Global concurrency cap across all workers and all projects.
  max_workers: 8
  # Maximum number of projects that may be actively scheduled at the same time.
  max_running_projects: 3
  # Per-project worker cap. Prevents one project from monopolizing the whole dispatcher.
  max_project_workers: 4
  # Timeout for each enabled worker healthcheck.
  healthcheck_timeout: 20
  # "startup_and_task" checks at dispatcher startup and before every task.
  # "startup_only" checks only at startup. "disabled" skips automatic worker checks.
  worker_healthcheck: "startup_only"
  # Prompt set loaded from cairn/src/cairn/dispatcher/prompts/.
  prompt_group: "default"
  # Side questions run outside the Decide/Execute slots, but still need a concurrency cap.
  max_questions: 1
  # Summaries run in the background, after the Decide that asked for them finished.
  max_summaries: 1
  # Budget for the graph snapshot handed to a worker. "enabled: false" pastes the graph verbatim.
  # A worker can override the window through CONTEXT_WINDOW (or PI_MODEL_CONTEXT_WINDOW) in its env.
  context_budget:
    enabled: true
    context_window: 200000
    max_output_tokens: 16000
    safety_ratio: 0.05
    safety_min_tokens: 2000
    safety_max_tokens: 18000
    # How many recent facts keep their original text.
    recent_items: 20
    # Summarization calls allowed per Decide run; 0 disables the rolling summary.
    summary_max_calls: 1
    summary_timeout: 90
    min_snapshot_tokens: 2000

# Two activities, one runner: Decide only edits the FGS graph, Execute acts on the world.
tasks:
  decide:
    # Decide reads the whole graph and returns graph mutations. It never touches the world.
    timeout: 300
    # Hard cap on how many new steps one Decide run may add.
    max_steps: 3
  execute:
    # Main timeout for executing a claimed step.
    timeout: 600
    # Time budget for the conclude fallback after the main phase times out or returns unusable output.
    conclude_timeout: 90

container:
  # Base worker container. The dispatcher execs agent commands inside one container per project.
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  network_mode: "host"
  # "stop" keeps finished containers for inspection; "remove" is cleaner but loses post-run state.
  completed_action: "stop"
  # Add Linux capabilities only when a task truly needs them, such as packet crafting or network admin actions.
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"


workers:
  # Worker priority is ascending: lower numbers are preferred first.
  # max_running is per-worker concurrency. Slower backends such as Pi usually benefit from lower values.
  # Decide benefits from a strong reasoning model; Execute benefits from a model that is good with tools.
  - name: "claudecode_deepseek-v4-pro"
    type: "claudecode"
    task_types: [decide, execute]
    max_running: 2
    priority: 0
    env:
      ANTHROPIC_MODEL: "deepseek-v4-pro"
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: "sk-xxx"

  # - name: "codex_qwen3.6-plus"
  #   type: "codex"
  #   task_types: [decide,execute]
  #   max_running: 2
  #   priority: 0
  #   env:
  #     CODEX_MODEL: "qwen3.6-plus"
  #     CODEX_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #     OPENAI_API_KEY: "sk-xxx"

  # - name: "pi_qwen3.6-plus"
  #   type: "pi"
  #   task_types: [decide,execute]
  #   max_running: 2
  #   priority: 0
  #   env:
  #     PI_MODEL: "qwen3.6-plus"
  #     PI_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #     PI_API_KEY: "sk-xxx"
  #     PI_PROVIDER_API: "openai-completions"
  #     PI_MODEL_CONTEXT_WINDOW: "262144"

# Web front (cairn-nginx) settings — consumed by the nginx Basic Auth entrypoint
# in Docker Compose mode; the dispatcher itself ignores this section.
# Passwords are written as plaintext here and hashed (SHA-512 crypt) into
# nginx's .htpasswd at container start.
# web:
#   auth:
#     realm: "Cairn"
#     users:
#       - name: admin
#         password: "<password>"
